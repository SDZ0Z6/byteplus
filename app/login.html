<!DOCTYPE html>
<html lang="zh-CN" data-side="full">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>登录 · BytePlus Kuromi 平台</title>
<link rel="icon" href="/static/Kuromi_Icon_50px_20260828.png">
<link rel="stylesheet" href="/app.css">
<style>
  /* 登录页是独立布局(没有侧边栏)，只借 app.css 的变量和控件样式。 */
  .split{display:flex;min-height:100vh}

  /* 左: 品牌 + 视觉。浅蓝白渐变，和主色 #1664ff 同一冷色调。 */
  .hero{
    flex:1 1 54%;min-width:0;padding:48px 4.5vw;
    display:flex;flex-direction:column;justify-content:center;gap:34px;
    background:linear-gradient(155deg,#f8faff 0%,#e9f0ff 52%,#f3f1ff 100%);
    border-right:1px solid var(--border);
  }
  .hero-top{display:flex;align-items:center;gap:14px}
  .hero-top img{width:56px;height:56px;display:block}
  .hero h2{margin:0;font-size:22px;font-weight:700;letter-spacing:.2px}
  .hero p{margin:5px 0 0;font-size:13px;color:var(--text-2)}
  .hero .accent{color:var(--blue)}
  .shot{
    width:100%;max-width:560px;height:auto;display:block;border-radius:16px;
    box-shadow:0 18px 48px rgba(22,100,255,.14);
  }

  /* 右: 表单 */
  .formside{
    flex:1 1 46%;min-width:0;display:flex;align-items:center;justify-content:center;
    background:var(--panel);padding:40px 24px;
  }
  .card{width:100%;max-width:340px}
  .form-brand{display:none;align-items:center;gap:10px;margin-bottom:26px}
  .form-brand img{width:30px;height:30px;display:block}
  .form-brand b{font-size:15px;font-weight:650}
  .card h1{margin:0 0 28px;font-size:26px;font-weight:700;text-align:center}

  .card label{display:block;font-size:12px;color:var(--text-2);margin-bottom:6px}
  .card input{
    width:100%;font:inherit;font-size:14px;padding:10px 12px;margin-bottom:18px;
    border:1px solid var(--border);border-radius:8px;background:var(--panel);
    color:var(--text);
  }
  /* focus 态必须写在这里且带 .card 前缀: app.css 的 input:focus 是 (0,1,1)，
     和 .card input 的 (0,1,1) 打平，而本页的 <style> 在 app.css 之后 ——
     平手时后者胜，边框会一直是灰的，focus 只剩一层很淡的光晕。 */
  .card input:focus{
    outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-1);
  }
  /* 外边距挪到容器上，眼睛按钮才能用 top/bottom:0 撑满输入框高度并居中 ——
     否则要按 padding 手算一个 top 值，改字号就歪。 */
  .pw{position:relative;margin-bottom:18px}
  .pw input{margin-bottom:0;padding-right:44px}
  .eye{
    position:absolute;top:0;bottom:0;right:6px;width:32px;padding:0;
    display:flex;align-items:center;justify-content:center;
    background:none;border:none;color:var(--muted);cursor:pointer;
  }
  /* 高亮，不压暗。带 .pw 前缀是必需的 —— app.css 里通用的
     button:hover:not(:disabled) 特异度 (0,2,1) 比 .eye:hover 的 (0,2,0) 高，
     不加前缀这个图标按钮 hover 会顶着一块深蓝实底。 */
  .pw .eye:hover{color:var(--blue);background:none}
  .pw .eye:active{color:var(--blue-hover)}
  .eye svg{width:17px;height:17px}

  .card button[type=submit]{
    width:100%;font-size:15px;font-weight:600;padding:11px;margin-top:6px;
    border-radius:8px;
  }
  .msg{
    display:none;background:var(--err-bg);border:1px solid #f6b8b2;color:var(--err);
    border-radius:8px;padding:9px 12px;font-size:12px;margin-bottom:18px;
  }
  .msg.show{display:block}

  /* 窄屏: 隐藏视觉块，品牌改到表单顶部 —— 那张拼图在手机上占满整屏
     却还要往下滚才能看见输入框，登录页最该做的是让人立刻能输入。 */
  @media (max-width:880px){
    .hero{display:none}
    .form-brand{display:flex}
    .formside{align-items:flex-start;padding-top:14vh}
    .card h1{text-align:left}
  }
</style>
</head>
<body>
<div class="split">

  <section class="hero">
    <div class="hero-top">
      <img src="/static/Kuromi_Icon_100px_20260828.png" alt="">
      <div>
        <h2>BytePlus <span class="accent">Kuromi</span> 平台</h2>
        <p>多账号授信与消费看板 · 授信额度 / 余额 / 已用 / 当期消费</p>
      </div>
    </div>
    <img class="shot" src="/static/Seedance_Login_20260828.png" alt="">
  </section>

  <section class="formside">
    <form class="card" id="form" autocomplete="on">
      <div class="form-brand">
        <img src="/static/Kuromi_Icon_50px_20260828.png" alt="">
        <b>BytePlus Kuromi 平台</b>
      </div>

      <h1>登录</h1>

      <div class="msg" id="msg"></div>

      <label for="u">用户名</label>
      <input id="u" name="username" type="text" autocomplete="username" required autofocus>

      <label for="p">密码</label>
      <div class="pw">
        <input id="p" name="password" type="password" autocomplete="current-password" required>
        <button type="button" class="eye" id="eye" aria-label="显示密码" title="显示密码">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
               stroke-linecap="round" stroke-linejoin="round">
            <path d="M2.5 12S6 5.5 12 5.5 21.5 12 21.5 12 18 18.5 12 18.5 2.5 12 2.5 12Z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>
      </div>

      <button type="submit" id="btn">登录</button>
    </form>
  </section>

</div>

<script>
const $ = id => document.getElementById(id);
const KEY = 'bp_auth';

// btoa() 遇到非 ASCII 会抛错，密码可能含中文/符号，这里先转 UTF-8 字节
function b64utf8(s){
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

function showMsg(text){
  const m = $('msg');
  m.textContent = text;
  m.classList.add('show');
}

// 登录成功后回到哪里。**必须校验** —— 不校验的话
// /login.html?returnTo=https://evil.com 就把登录页变成了开放重定向，
// 用户输完密码直接被送去钓鱼站。
function safeReturnTo(){
  let raw;
  try{
    raw = new URLSearchParams(location.search).get('returnTo');
  }catch(e){ return '/'; }
  if(!raw) return '/';
  // 必须以单个 / 开头: 挡掉绝对 URL 和 //evil.com 这种协议相对地址
  if(!/^\/[^/\\]/.test(raw)) return '/';
  // 挡掉 javascript: data: 之类；我们自己的路径不含冒号
  if(raw.includes(':')) return '/';
  // 别绕回登录页自己，否则会来回弹
  if(raw.split('?')[0] === '/login.html') return '/';
  return raw;
}

// 塔台一键登录(POST /login)失败时，服务端会 302 到这里并带上 ?err=<码>。
// 码和 server.py 的 LOGIN_ERR_* 一一对应。
const FORM_ERRORS = {
  '1': '用户名或密码错误',
  '2': '尝试次数过多，请稍后再试',
};
(function showFormLoginError(){
  let qs;
  try{ qs = new URLSearchParams(location.search); }catch(e){ return; }
  const code = qs.get('err');
  if(!code) return;
  showMsg(FORM_ERRORS[code] || '登录失败');
  // 从地址栏去掉 err，刷新页面就不会再报一次；returnTo 之类的参数保留
  qs.delete('err');
  const rest = qs.toString();
  history.replaceState(null, '', location.pathname + (rest ? '?' + rest : ''));
})();

// 已经登录过就直接进主页
(async function autoRedirect(){
  const token = sessionStorage.getItem(KEY);
  if(!token) return;
  try{
    const res = await fetch('/api/verify', {
      headers: {'Authorization': 'Basic ' + token}, cache: 'no-store'});
    if(res.ok) location.replace(safeReturnTo());
    else sessionStorage.removeItem(KEY);
  }catch(e){ /* 网络问题就正常显示登录表单 */ }
})();

// 明文/密文切换。只改 type，值不经过任何中转。
$('eye').addEventListener('click', () => {
  const p = $('p');
  const show = p.type === 'password';
  p.type = show ? 'text' : 'password';
  $('eye').title = $('eye').ariaLabel = show ? '隐藏密码' : '显示密码';
  p.focus();
});

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('btn');
  $('msg').classList.remove('show');
  btn.disabled = true;
  btn.textContent = '登录中…';

  const token = b64utf8($('u').value + ':' + $('p').value);
  try{
    const res = await fetch('/api/verify', {
      headers: {'Authorization': 'Basic ' + token}, cache: 'no-store'});

    if(res.ok){
      sessionStorage.setItem(KEY, token);
      location.replace(safeReturnTo());
      return;
    }
    if(res.status === 429){
      const d = await res.json().catch(() => ({}));
      showMsg(d.error || '尝试次数过多，请稍后再试');
    }else if(res.status === 401){
      showMsg('用户名或密码错误');
    }else{
      showMsg('登录失败：HTTP ' + res.status);
    }
  }catch(e){
    showMsg('连不上服务器：' + e.message);
  }finally{
    btn.disabled = false;
    btn.textContent = '登录';
    $('p').select();
  }
});
</script>
</body>
</html>
