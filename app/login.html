<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BytePlus Kuromi 平台</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#e3e6ea; --text:#1c1f23; --muted:#6b7280;
    --accent:#2563eb; --err:#c2261a; --err-bg:#fdf2f1;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#15181c; --panel:#1c2025; --border:#2e343b; --text:#e6e9ed; --muted:#98a1ac;
      --accent:#5b9cff; --err:#ff6b5e; --err-bg:#2a1c1a;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background:var(--bg); color:var(--text); padding:24px;
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  .card{
    background:var(--panel); border:1px solid var(--border); border-radius:12px;
    padding:30px 32px; width:100%; max-width:360px;
  }
  h1{font-size:19px; margin:0 0 4px; font-weight:650}
  .sub{color:var(--muted); font-size:12px; margin-bottom:22px}
  label{display:block; font-size:12px; color:var(--muted); margin-bottom:5px}
  input{
    width:100%; font:inherit; padding:9px 11px; margin-bottom:15px;
    border:1px solid var(--border); border-radius:7px;
    background:var(--bg); color:var(--text);
  }
  input:focus{outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent}
  button{
    width:100%; font:inherit; font-weight:600; padding:10px; margin-top:3px;
    border:none; border-radius:7px; background:var(--accent); color:#fff; cursor:pointer;
  }
  button:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.55; cursor:progress}
  .msg{
    display:none; background:var(--err-bg); border:1px solid var(--err); color:var(--err);
    border-radius:7px; padding:9px 11px; font-size:12px; margin-bottom:15px;
  }
  .msg.show{display:block}
  .note{margin-top:18px; font-size:11px; color:var(--muted); line-height:1.7}
</style>
</head>
<body>
  <form class="card" id="form" autocomplete="on">
    <h1>BytePlus Kuromi 平台</h1>
    <div class="sub">请登录后查看授信与消费数据</div>

    <div class="msg" id="msg"></div>

    <label for="u">用户名</label>
    <input id="u" name="username" autocomplete="username" required autofocus>

    <label for="p">密码</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>

    <button type="submit" id="btn">登录</button>

    <div class="note" id="note">
      凭据只保存在当前标签页（<code>sessionStorage</code>），关闭标签页即自动登出。
    </div>
  </form>

<script>
const $ = id => document.getElementById(id);
const KEY = 'bp_auth';

// btoa() 遇到非 ASCII 会抛错，密码可能含中文/符号，这里先转 UTF-8 字节
function b64utf8(s){
  const bytes = new TextEncoder().encode(s);
  let bin = '';
  bytes.forEach(b => bin += String.fromCharCode(b));
  return btoa(bin);
}

function showMsg(text){
  const m = $('msg');
  m.textContent = text;
  m.classList.add('show');
}

// 登录成功后回到哪里。**必须校验** —— 不校验的话
// /login.html?returnTo=https://evil.com 就把登录页变成了开放重定向，
// 用户输完密码直接被送去钓鱼站。
function safeReturnTo(){
  let raw;
  try{
    raw = new URLSearchParams(location.search).get('returnTo');
  }catch(e){ return '/'; }
  if(!raw) return '/';
  // 必须以单个 / 开头: 挡掉绝对 URL 和 //evil.com 这种协议相对地址
  if(!/^\/[^/\\]/.test(raw)) return '/';
  // 挡掉 javascript: data: 之类；我们自己的路径不含冒号
  if(raw.includes(':')) return '/';
  // 别绕回登录页自己，否则会来回弹
  if(raw.split('?')[0] === '/login.html') return '/';
  return raw;
}

// 已经登录过就直接进主页
(async function autoRedirect(){
  const token = sessionStorage.getItem(KEY);
  if(!token) return;
  try{
    const res = await fetch('/api/verify', {
      headers: {'Authorization': 'Basic ' + token}, cache: 'no-store'});
    if(res.ok) location.replace(safeReturnTo());
    else sessionStorage.removeItem(KEY);
  }catch(e){ /* 网络问题就正常显示登录表单 */ }
})();

$('form').addEventListener('submit', async ev => {
  ev.preventDefault();
  const btn = $('btn');
  $('msg').classList.remove('show');
  btn.disabled = true;
  btn.textContent = '登录中…';

  const token = b64utf8($('u').value + ':' + $('p').value);
  try{
    const res = await fetch('/api/verify', {
      headers: {'Authorization': 'Basic ' + token}, cache: 'no-store'});

    if(res.ok){
      sessionStorage.setItem(KEY, token);
      location.replace(safeReturnTo());
      return;
    }
    if(res.status === 429){
      const d = await res.json().catch(() => ({}));
      showMsg(d.error || '尝试次数过多，请稍后再试');
    }else if(res.status === 401){
      showMsg('用户名或密码错误');
    }else{
      showMsg('登录失败：HTTP ' + res.status);
    }
  }catch(e){
    showMsg('连不上服务器：' + e.message);
  }finally{
    btn.disabled = false;
    btn.textContent = '登录';
    $('p').select();
  }
});
</script>
</body>
</html>
