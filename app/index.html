<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>授信总览 · BytePlus Kuromi 平台</title>
<link rel="icon" href="/static/Kuromi_Icon_50px_20260828.png">
<link rel="stylesheet" href="/app.css">
<!-- 侧边栏收起状态必须在首帧之前定好，否则切页时侧边栏会先画成展开态再抽回去 -->
<script>
try{
  document.documentElement.dataset.side =
    (localStorage.getItem('bp_side') === 'mini') ? 'mini' : 'full';
}catch(e){ document.documentElement.dataset.side = 'full'; }
</script>
<style>
  /* 总览表窄一些，给账号列留足空间即可 */
  #tbl{min-width:760px}
</style>
</head>
<body>
<div class="app">

  <aside class="side" id="side"></aside>
  <div class="backdrop" id="backdrop"></div>

  <main class="main"><div class="wrap">

    <div class="topbar">
      <button class="hamb" id="hamb" type="button" aria-label="菜单"></button>
      <h1>授信总览</h1>
      <span class="sub">原授信额度 · 授信余额 · 已用 · 当期消费（全部美金 USD）</span>
    </div>

    <div class="toolbar">
      <label for="period">账期</label>
      <input type="month" id="period">
      <button id="refresh">刷新</button>
      <span class="spacer"></span>
      <span class="stamp" id="stamp"></span>
    </div>

    <div id="err"></div>
    <div class="cards" id="cards"></div>

    <div class="panel"><div class="scroll">
      <table id="tbl">
        <thead>
          <tr>
            <th class="l">账号</th>
            <th>原授信额度</th>
            <th>授信余额</th>
            <th>已用（累计消费）</th>
            <th id="thPeriod">当期消费</th>
            <th>状态</th>
          </tr>
        </thead>
        <tbody id="rows">
          <tr><td colspan="6" class="skel">加载中…</td></tr>
        </tbody>
        <tfoot id="foot"></tfoot>
      </table>
    </div></div>

    <footer id="notes"></footer>

  </div></main>
</div>

<script src="/common.js"></script>
<script>
const $ = id => document.getElementById(id);

initShell('overview');

function renderCards(d){
  const t = d.totals || {};
  const cur = ' <span class="dim" style="font-size:12px;font-weight:400">'+esc(d.currency)+'</span>';
  const items = [
    ['账号数', String(d.account_count) + (d.error_count ? ' <span class="bad" style="font-size:12px">'+d.error_count+' 异常</span>' : ''), ''],
    ['原授信额度合计', money(t.granted, {atLeast: d.totals_partial}) + cur, ''],
    ['授信余额合计', money(t.balance) + cur, ''],
    ['已用合计', money(t.used) + cur, ''],
    [esc(d.period) + ' 消费合计', money(t.selected_spend) + cur, ' accent'],
  ];
  $('cards').innerHTML = items.map(([k,v,cls]) =>
    '<div class="card'+cls+'"><div class="k">'+k+'</div><div class="v">'+v+'</div></div>').join('');
}

// 账单页链接。带上当前账期，这样账单页打开就是同一个月、同一个账号。
function billHref(uid){
  const p = $('period').value || defaultPeriod();
  return '/bill.html?uid=' + encodeURIComponent(uid)
       + '&period=' + encodeURIComponent(p);
}

function renderRows(d){
  const tb = $('rows');
  if(!d.accounts.length){
    tb.innerHTML = '<tr><td colspan="6" class="skel">cred.xlsx 里没有账号</td></tr>';
    return;
  }
  let html = '';
  for(const a of d.accounts){
    const q = a.quota || {};
    const sel = a.selected_spend || {};
    const granted = Number(a.granted), used = Number(a.used);
    const pct = (isFinite(granted) && granted > 0 && isFinite(used))
      ? Math.max(0, Math.min(100, used / granted * 100)) : null;

    // 账号名即下钻入口: 点进去是该账号该账期的账单页
    html += '<tr>'
      + '<td class="l">'
      +   '<a class="acct" href="' + billHref(a.uid) + '">'
      +     esc(a.email || '(无邮箱)') + '</a>'
      +   '<div class="meta">UID ' + esc(a.uid) + ' · ' + esc(a.ak_masked) + '</div></td>';

    // 原授信额度（推算值）
    html += '<td class="strong">' + money(a.granted, {atLeast: a.granted_partial})
          + (a.granted_partial ? '<div class="meta bad">数据不完整</div>' : '')
          + '</td>';

    // 授信余额
    if(a.quota_error){
      html += '<td class="bad">查询失败</td>';
    }else{
      html += '<td>' + money(q.balance)
            + (nonZero(q.frozen) ? '<div class="meta warnval">冻结 ' + esc(q.frozen) + '</div>' : '')
            + '</td>';
    }

    // 已用（累计消费）+ 占比条
    html += '<td>' + money(a.used)
          + (pct !== null
              ? '<div class="meta">' + pct.toFixed(1) + '%</div>'
                + '<div class="bar"><i style="width:' + pct.toFixed(1) + '%"></i></div>'
              : '')
          + '</td>';

    // 当期消费 —— 纯展示，不做跳转
    if(a.selected_spend_error){
      html += '<td class="bad">查询失败</td>';
    }else{
      html += '<td>' + money(sel.total)
            + (sel.products ? '<div class="meta">' + sel.products + ' 个产品</div>' : '')
            + (sel.from_cache ? '<div class="meta">缓存</div>' : '')
            + (sel.truncated ? '<div class="meta bad">产品数超上限，可能少算</div>' : '')
            + '</td>';
    }

    html += '<td>' + (a.ok
        ? (a.granted_partial ? '<span class="pill warn">部分</span>'
                             : '<span class="pill">正常</span>')
        : '<span class="pill bad">异常</span>') + '</td>'
      + '</tr>';

    const errs = [
      a.quota_error && '授信余额: ' + errText(a.quota_error),
      a.selected_spend_error && '当期消费: ' + errText(a.selected_spend_error),
      a.current_spend_error && '当月消费: ' + errText(a.current_spend_error),
    ].filter(Boolean);
    if(errs.length){
      html += '<tr class="errline"><td colspan="6">' + errs.join('<br>') + '</td></tr>';
    }
    if(a.notes && a.notes.length){
      html += '<tr class="noteline"><td colspan="6">' + a.notes.map(esc).join('<br>') + '</td></tr>';
    }
  }
  tb.innerHTML = html;

  const t = d.totals || {};
  $('foot').innerHTML = '<tr><td class="l">合计</td>'
    + '<td>' + money(t.granted, {atLeast: d.totals_partial}) + '</td>'
    + '<td>' + money(t.balance) + '</td>'
    + '<td>' + money(t.used) + '</td>'
    + '<td>' + money(t.selected_spend) + '</td>'
    + '<td></td></tr>';
}

function renderNotes(d){
  const backs = d.accounts.map(a => a.scanned_back_to).filter(Boolean).sort();
  $('notes').innerHTML =
      '<b>原授信额度是推算值</b>：BytePlus 接口没有这个字段，用 '
    + '<code>授信余额 + 累计消费</code> 算出来（已用真实数据核对：'
    + '188.71 + 11.29 = 200.00、999.92 + 0.08 = 1000.00）。'
    + '授信余额是按消费扣减的，所以「已用」就等于累计消费。<br>'
    + '<b>精度</b>：额度扣减比账单接口略有延迟，所以推算出的原授信额度可能在几分钱范围内波动'
    + '（实测同一账号在 1538.00 / 1538.02 之间跳）。真实授信通常是整数，可据此判断。<br>'
    + '<b>累计消费的范围</b>：从当月往前逐月累加，连续无消费的月份达到设定数量即停'
    + (backs.length ? '（本次最早扫到 ' + esc(backs[0]) + '）' : '')
    + '。已结账的月份会永久缓存，所以每次刷新只重新查当月。'
    + '若某个账期取数失败，该账号的原授信额度会标成 <code>≥</code> 下限值，不会把失败当成 0。<br>'
    + '<b>币种</b>：按需求统一按 ' + esc(d.currency) + ' 显示。<br>'
    + '<b>模式</b>：当月数据每次刷新都实时查 BytePlus API。账号来自 <code>cred.xlsx</code>，'
    + '改完点刷新即可生效（无需重启）。点账号名可看该账期的<b>账单明细</b>。';
}

function applyData(data){
  $('thPeriod').textContent = data.period + ' 消费';
  renderCards(data);
  renderRows(data);
  renderNotes(data);
}

// ---- 返回总览时不重查 ------------------------------------------------------
// 从账单页按返回键回来，本不该重新查一遍所有账号的接口。
// 首选是浏览器 bfcache(整页从内存恢复)，服务端已把页面文档的 Cache-Control
// 从 no-store 改成 no-cache 来保住它 —— 但 bfcache 还会被"附加了调试器"、
// 内存压力、超时等因素取消，不能指望。所以这里再兜一层:
// 离开前把总览数据存进 sessionStorage，返回导航时直接拿它渲染。
const SNAP_KEY = 'bp_overview_snap';
const SNAP_TTL_MS = 10 * 60 * 1000;   // 超过 10 分钟就宁可重查

function saveSnapshot(data){
  try{
    sessionStorage.setItem(SNAP_KEY, JSON.stringify({at: Date.now(), data: data}));
  }catch(e){ /* 配额满/隐私模式下失败无所谓，退化成重新查询 */ }
}

function loadSnapshot(){
  try{
    const s = JSON.parse(sessionStorage.getItem(SNAP_KEY) || 'null');
    if(!s || !s.data || (Date.now() - s.at) > SNAP_TTL_MS) return null;
    return s.data;
  }catch(e){ return null; }
}

async function load(){
  const btn = $('refresh');
  btn.disabled = true;
  btn.textContent = '查询中…';
  $('err').innerHTML = '';
  $('stamp').textContent = '正在查询 BytePlus API…';

  const period = $('period').value || defaultPeriod();
  try{
    const res = await fetch(apiURL('/api/accounts', {period: period}),
                            {cache:'no-store', headers: authHeader()});

    // 未登录 / 凭据失效 -> 回登录页。凭据只在浏览器里，服务端无 session。
    if(res.status === 401){ return toLogin(); }
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));

    applyData(data);
    saveSnapshot(data);
    $('stamp').textContent = '更新于 ' + fmtLocal(data.fetched_at)
                           + ' · 耗时 ' + data.elapsed_ms + ' ms';
  }catch(e){
    $('err').innerHTML = '<div class="errbox">加载失败: ' + esc(e.message) + '</div>';
    $('rows').innerHTML = '<tr><td colspan="6" class="skel">—</td></tr>';
    $('foot').innerHTML = '';
    $('cards').innerHTML = '';
    $('stamp').textContent = '';
  }finally{
    btn.disabled = false;
    btn.textContent = '刷新';
  }
}

$('period').value = defaultPeriod();
$('period').max = defaultPeriod();
$('refresh').addEventListener('click', load);
$('period').addEventListener('change', load);

// 什么时候算"从账单页回来"，可以直接用快照而不重查:
//   1. 浏览器返回/前进键 -> navigation.type === 'back_forward'
//   2. 账单页的「返回总览」链接 -> 那是**前进导航**(type = navigate)，
//      拿不到上面那条路径，所以链接上带了 ?restore=1 作为显式标记。
//      (本想用 document.referrer 判断来源，但响应头设了 Referrer-Policy:
//       no-referrer，它恒为空，用不了。)
// 其它情况一律照常查: 首次打开、刷新页面、手动输地址。
const navEntry = performance.getEntriesByType('navigation')[0] || {};
let wantRestore = navEntry.type === 'back_forward';
try{
  if(new URLSearchParams(location.search).get('restore') === '1') wantRestore = true;
}catch(e){ /* 忽略 */ }

// 标记用完就把地址栏洗干净，别让 ?restore=1 被收藏或分享出去
if(location.search){
  history.replaceState(null, '', location.pathname);
}

const snapshot = wantRestore ? loadSnapshot() : null;

if(snapshot){
  $('period').value = snapshot.period;
  applyData(snapshot);
  $('stamp').innerHTML = '更新于 ' + fmtLocal(snapshot.fetched_at)
    + ' <span class="dim">· 返回时的数据，点刷新可更新</span>';
}else{
  load();
}

// bfcache 真正生效时脚本不会重跑，页面整个从内存恢复 —— 那样更好(连滚动位置
// 都在)。这里只把时间戳标注一下，让人知道看到的不是刚查的。
window.addEventListener('pageshow', ev => {
  if(!ev.persisted) return;
  const s = $('stamp').textContent;
  if(s && s.indexOf('返回时的数据') === -1){
    $('stamp').innerHTML = esc(s) + ' <span class="dim">· 返回时的数据，点刷新可更新</span>';
  }
});
</script>
</body>
</html>
