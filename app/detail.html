<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>账单明细 · BytePlus Kuromi 平台</title>
<style>
  :root{
    --bg:#f6f7f9; --panel:#fff; --border:#e3e6ea; --text:#1c1f23; --muted:#6b7280;
    --accent:#2563eb; --ok:#128a52; --warn:#b45309; --err:#c2261a;
    --err-bg:#fdf2f1; --head:#f0f2f5; --zebra:#fafbfc;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#15181c; --panel:#1c2025; --border:#2e343b; --text:#e6e9ed; --muted:#98a1ac;
      --accent:#5b9cff; --ok:#3ecf8e; --warn:#e0a049; --err:#ff6b5e;
      --err-bg:#2a1c1a; --head:#22272d; --zebra:#1f2429;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0; padding:22px; background:var(--bg); color:var(--text);
    font:14px/1.5 "Segoe UI","Microsoft YaHei",system-ui,sans-serif;
  }
  .wrap{max-width:1400px;margin:0 auto}
  header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  h1{font-size:20px;margin:0;font-weight:650}
  .sub{color:var(--muted);font-size:12px}
  a.back{
    color:var(--accent);text-decoration:none;font-size:13px;font-weight:550;
    border:1px solid var(--border);border-radius:6px;padding:5px 12px;
  }
  a.back:hover{background:var(--head)}
  .toolbar{
    display:flex;gap:10px;align-items:center;flex-wrap:wrap;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:12px 14px;margin-bottom:16px;
  }
  label{font-size:12px;color:var(--muted)}
  input[type=month]{
    font:inherit;padding:6px 8px;border:1px solid var(--border);border-radius:6px;
    background:var(--bg);color:var(--text);
  }
  button{
    font:inherit;font-weight:550;padding:7px 15px;border-radius:6px;cursor:pointer;
    border:1px solid transparent;background:var(--accent);color:#fff;
  }
  button:hover:not(:disabled){filter:brightness(1.08)}
  button:disabled{opacity:.55;cursor:progress}
  .spacer{flex:1}
  .stamp{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}

  .panel{background:var(--panel);border:1px solid var(--border);border-radius:10px;overflow-x:auto}
  table{border-collapse:collapse;width:100%;min-width:1080px}
  th,td{padding:8px 13px;text-align:right;border-bottom:1px solid var(--border);white-space:nowrap;font-size:12px}
  thead th{background:var(--head);font-weight:600;color:var(--muted);position:sticky;top:0;z-index:1}
  th.l,td.l{text-align:left}
  .num{font-variant-numeric:tabular-nums}
  .meta{font-size:11px;color:var(--muted);font-weight:400}
  .dim{color:var(--muted)}
  .bad{color:var(--err)}
  .good{color:var(--ok)}
  .warnval{color:var(--warn)}
  tr.grp td{
    background:var(--zebra);font-weight:650;cursor:pointer;
    border-top:1px solid var(--border);
  }
  tr.grp td:hover{filter:brightness(.98)}
  tr.grp .caret{display:inline-block;width:12px;color:var(--muted)}
  tr.det-row.hidden{display:none}
  .zero{color:var(--muted)}
  .errbox{
    background:var(--err-bg);border:1px solid var(--err);color:var(--err);
    border-radius:8px;padding:12px 14px;margin-bottom:16px;white-space:pre-wrap;
  }
  .skel{padding:40px;text-align:center;color:var(--muted)}

  /* ---- 日消费柱状图 ------------------------------------------------------
     单序列，所以不需要图例(标题即序列名)。配色用经校验的 slot-1 蓝:
     本应用的 --accent 在暗色面板上亮度超标(L 0.695，带宽 0.48–0.67)，
     validate_palette.py 判 FAIL，所以图元另用一档。 */
  .chart{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:14px 18px 10px;margin-bottom:16px;
    --series-1:#2a78d6; --grid:#e1e0d9; --baseline:#c3c2b7;
  }
  @media (prefers-color-scheme:dark){
    .chart{ --series-1:#3987e5; --grid:#2c2c2a; --baseline:#383835; }
  }
  .chart-head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .chart-head h2{font-size:13px;margin:0;font-weight:650}
  .chart-head .hint{font-size:11px;color:var(--muted)}
  .chart-head .spacer{flex:1}
  .plot{
    display:flex;align-items:flex-end;gap:2px;height:132px;
    border-bottom:1px solid var(--baseline);
    background:linear-gradient(var(--grid),var(--grid)) 0 33.3%/100% 1px no-repeat,
               linear-gradient(var(--grid),var(--grid)) 0 66.6%/100% 1px no-repeat;
  }
  .col{flex:1;height:100%;display:flex;align-items:flex-end;position:relative;min-width:0}
  .col .bar{
    width:100%;background:var(--series-1);
    border-radius:4px 4px 0 0;      /* 数据端 4px 圆角，底端贴基线 */
    /* 非零值至少 2px —— 小额日子(实测 0.04)按比例只有 0.3px，
       画出来和"零"完全看不出区别，那等于把数据弄丢了。零值仍然是零。 */
    min-height:2px;
  }
  .col.zero .bar{height:0;min-height:0}
  .col .tip{
    display:none;position:absolute;bottom:100%;left:50%;transform:translateX(-50%);
    margin-bottom:6px;white-space:nowrap;z-index:5;
    background:var(--panel);border:1px solid var(--border);border-radius:6px;
    padding:5px 9px;font-size:11px;line-height:1.5;
    box-shadow:0 4px 14px rgba(0,0,0,.18);color:var(--text);
  }
  .col:hover .tip{display:block}
  /* 两端的列: 提示框改为贴边对齐，否则居中会溢出图表外 */
  .col:first-child .tip,.col:nth-child(2) .tip{left:0;transform:none}
  .col:last-child .tip,.col:nth-last-child(2) .tip{left:auto;right:0;transform:none}
  .col:hover .bar{filter:brightness(1.12)}
  /* 命中区域比柱子宽，细柱也好悬停 */
  .col::after{content:'';position:absolute;inset:0}
  .xaxis{display:flex;gap:2px;margin-top:5px}
  .xaxis span{
    flex:1;text-align:center;font-size:10px;color:var(--muted);
    font-variant-numeric:tabular-nums;min-width:0;overflow:hidden;
  }
  .daycell{font-variant-numeric:tabular-nums}
  tr.grp td .sub{font-weight:400;color:var(--muted);font-size:11px;margin-left:8px}
  .totals{
    display:flex;gap:16px;flex-wrap:wrap;align-items:center;
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:12px 16px;margin-top:14px;font-size:13px;
  }
  footer{margin-top:14px;font-size:11px;color:var(--muted);line-height:1.75}
  code{background:var(--head);padding:1px 4px;border-radius:3px}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <!-- restore=1 告诉总览页"这是返回，可以用快照" —— 点链接属于前进导航
         (navigation.type = navigate)，拿不到 back_forward 那条路径。
         referrer 也用不了: 响应头设了 Referrer-Policy: no-referrer，恒为空。 -->
    <a class="back" href="/?restore=1" id="back">‹ 返回总览</a>
    <h1>账单明细</h1>
    <span class="sub" id="who"></span>
  </header>

  <div class="toolbar">
    <label for="period">账期</label>
    <input type="month" id="period">
    <button id="refresh">刷新</button>
    <span class="spacer"></span>
    <span class="stamp" id="stamp"></span>
  </div>

  <div id="err"></div>
  <div id="chart"></div>
  <div class="panel"><table>
    <thead><tr>
      <th class="l">产品 / 实例</th><th class="l">实例 ID</th><th class="l">地域</th>
      <th class="l">规格</th><th class="l">计费方式</th><th>单价</th><th>用量</th>
      <th>原始金额</th><th>抹零</th><th>应付金额</th><th class="l">项目</th>
    </tr></thead>
    <tbody id="rows"><tr><td colspan="11" class="skel">加载中…</td></tr></tbody>
  </table></div>

  <div class="totals" id="totals"></div>
  <footer id="notes"></footer>

</div>

<script src="/common.js"></script>
<script>
const $ = id => document.getElementById(id);

function qs(name){
  try{ return new URLSearchParams(location.search).get(name); }
  catch(e){ return null; }
}

const UID = (qs('uid') || '').trim();
let period = (qs('period') || '').trim();
if(!PERIOD_RE.test(period)) period = defaultPeriod();

// 换账期时把 URL 一起改掉，这样刷新/收藏/返回都指向同一个账期
function setPeriod(p){
  period = p;
  const u = new URL(location.href);
  u.searchParams.set('uid', UID);
  u.searchParams.set('period', p);
  history.replaceState(null, '', u.pathname + u.search);
}

// 单序列柱状图: 每天的应付合计，不区分计费方式 —— 下面明细表的「计费方式」
// 那一列已经逐行说明了，图上再拆一次是重复。
function renderChart(d){
  const cur = d.currency ? ' ' + d.currency : '';
  const max = Number(d.max_payable) || 0;
  const days = d.days || [];

  if(!days.length){ $('chart').innerHTML = ''; return; }

  const bars = days.map(g => {
    const v = Number(g.payable) || 0;
    const pct = max > 0 ? (v / max * 100) : 0;
    const tip = esc(g.date) + '<br>' + v.toFixed(2) + esc(cur)
              + (g.rows.length ? '<br><span class="dim">' + g.rows.length + ' 项</span>' : '');
    return {
      col: '<div class="col' + (v > 0 ? '' : ' zero') + '">'
         +   '<div class="bar" style="height:' + pct.toFixed(2) + '%"></div>'
         +   '<div class="tip">' + tip + '</div>'
         + '</div>',
      label: '<span title="' + esc(g.date) + '">' + g.date.slice(8) + '</span>'
    };
  });

  $('chart').innerHTML =
      '<div class="chart">'
    + '<div class="chart-head">'
    +   '<h2>日消费</h2>'
    +   '<span class="hint">' + esc(d.period)
    +     (d.is_current_month ? ' · 截至 ' + esc(d.through) : '') + '</span>'
    +   '<span class="spacer"></span>'
    +   '<span class="hint">峰值 ' + (max ? max.toFixed(2) : '0.00') + esc(cur) + '</span>'
    + '</div>'
    + '<div class="plot">' + bars.map(b => b.col).join('') + '</div>'
    + '<div class="xaxis">' + bars.map(b => b.label).join('') + '</div>'
    + '</div>';
}

function render(d){
  $('who').textContent = (d.email ? d.email + ' · ' : '') + 'UID ' + d.uid + ' · ' + d.period;
  document.title = '账单明细 · ' + (d.email || d.uid);
  $('stamp').textContent = '共 ' + d.row_count + ' 条 · 耗时 ' + d.elapsed_ms + ' ms';

  const cur = d.currency ? ' <span class="dim">' + esc(d.currency) + '</span>' : '';

  renderChart(d);

  const withRows = d.days.filter(g => g.rows.length);
  if(!withRows.length){
    $('rows').innerHTML = '<tr><td colspan="11" class="skel">该账期没有消费记录</td></tr>';
  }else{
    let html = '';
    // 只列有数据的日子；无消费的日子在柱状图上已经能看出来，
    // 表格里再塞一堆空行只会把有用的行挤下去
    withRows.forEach((g, gi) => {
      html += '<tr class="grp" data-g="' + gi + '">'
        + '<td class="l" colspan="7"><span class="caret">▾</span> '
        +   '<span class="daycell">' + esc(g.date) + '</span>'
        +   '<span class="sub">' + g.rows.length + ' 项</span></td>'
        + '<td>' + amt6(g.original) + '</td><td></td>'
        + '<td>' + money(g.payable) + cur + '</td><td></td></tr>';

      g.rows.forEach(r => {
        html += '<tr class="det-row" data-g="' + gi + '">'
          + '<td class="l"><div>' + esc(r.product) + '</div>'
          +   '<div class="meta">' + esc(r.instance_name || r.instance_id || '—')
          +   '</div></td>'
          + '<td class="l dim">' + esc(r.instance_id || '—') + '</td>'
          + '<td class="l">' + esc(r.region || '—') + '</td>'
          + '<td class="l dim">' + esc(r.spec || '—') + '</td>'
          + '<td class="l dim">' + esc(r.billing_mode || '—') + '</td>'
          + '<td class="dim">' + (r.price ? esc(r.price) + (r.price_unit ? ' <span class="meta">' + esc(r.price_unit) + '</span>' : '') : '—') + '</td>'
          + '<td class="dim">' + (r.usage ? esc(r.usage) + (r.usage_unit ? ' <span class="meta">' + esc(r.usage_unit) + '</span>' : '') : '—') + '</td>'
          + '<td class="dim">' + amt6(r.original) + '</td>'
          + '<td class="' + (nonZero(r.rounded) ? 'warnval' : 'dim') + '">' + amt6(r.rounded) + '</td>'
          + '<td class="' + (Number(r.payable) === 0 ? 'zero' : '') + '">' + money(r.payable) + '</td>'
          + '<td class="l dim">' + esc(r.project || '—') + '</td>'
          + '</tr>';
      });
    });
    $('rows').innerHTML = html;
  }

  // ---- 合计 + 对账 ----
  // 明细合计应当等于概览合计(两边都取 PosttaxAmount)。概览由服务端一并返回,
  // 因为本页是独立页面，拿不到总览页那份数据。
  let check;
  if(d.overview_error){
    check = '<span class="bad">⚠ 概览取数失败，无法核对：'
          + errText(d.overview_error) + '</span>';
  }else if(d.overview_total === null || d.overview_total === undefined){
    check = '<span class="dim">概览无数据，未核对</span>';
  }else if(Number(d.overview_total) === Number(d.total_payable)){
    check = '<span class="good">✓ 与概览合计一致</span>';
  }else{
    check = '<span class="bad">⚠ 与概览合计不一致（概览 '
          + esc(String(d.overview_total)) + '）</span>';
  }

  $('totals').innerHTML =
      '<b>合计应付 ' + money(d.total_payable) + cur + '</b>'
    + '<span class="dim">原始金额 ' + amt6(d.total_original) + cur + '（差额为抹零）</span>'
    + check
    + (d.truncated ? '<span class="bad">⚠ 超出翻页上限，可能不全</span>' : '')
    + (d.reported_total !== null && d.reported_total !== d.row_count
        ? '<span class="bad">⚠ 接口报告 ' + d.reported_total + ' 条，实际取到 '
          + d.row_count + ' 条</span>' : '');

  $('notes').innerHTML =
      '<b>口径</b>：应付金额取 <code>PosttaxAmount</code>（含税应付，已核对 = 已付 + 未付），'
    + '与总览页「当期消费」同一字段，所以两处必然相等。<br>'
    + '<b>抹零</b>：原始金额与应付金额的差额。抹零常在 1e-5 量级，所以原始金额和抹零两列'
    + '最多显示 6 位小数 —— 只显示 2 位会变成 0.00，正好把要解释的信息抹掉。'
    + '某行应付为 0 但原始不为 0，说明整笔被抹零了，不是漏算。<br>'
    + '<b>粒度</b>：<code>GroupTerm=0 + GroupPeriod=1</code>，每个资源每天一行'
    + '（按计费项拆分，同一资源同一天可能出现多行），前端按日期分组。<br>'
    + '<b>这张图回答的是「哪天产生了账」，不是「哪天用了多少」</b>：包月/预付资源'
    + '会把整笔费用记在<b>购买或续费当天</b>，不是均摊到每天，所以某一天可能明显偏高。'
    + '展开那天看「计费方式」列即可分辨 —— <code>Pay-as-you-go</code> 是当天真实用量，'
    + '<code>Yearly/monthly</code> 是一次性入账。';
}

async function load(){
  const btn = $('refresh');
  btn.disabled = true; btn.textContent = '查询中…';
  $('err').innerHTML = '';
  $('stamp').textContent = '正在查询 BytePlus API…';

  try{
    const res = await fetch(apiURL('/api/detail', {uid: UID, period: period}),
                            {cache:'no-store', headers: authHeader()});
    if(res.status === 401){ return toLogin(); }
    const data = await res.json();
    if(!res.ok || data.error) throw new Error(data.error || ('HTTP ' + res.status));
    render(data);
  }catch(e){
    $('err').innerHTML = '<div class="errbox">加载失败: ' + esc(e.message) + '</div>';
    $('rows').innerHTML = '<tr><td colspan="11" class="skel">—</td></tr>';
    $('totals').innerHTML = ''; $('stamp').textContent = '';
  }finally{
    btn.disabled = false; btn.textContent = '刷新';
  }
}

// 产品分组折叠
$('rows').addEventListener('click', ev => {
  const grp = ev.target.closest('tr.grp');
  if(!grp) return;
  const gi = grp.dataset.g;
  let collapsed = false;
  $('rows').querySelectorAll('tr.det-row[data-g="' + gi + '"]').forEach(tr => {
    tr.classList.toggle('hidden');
    collapsed = tr.classList.contains('hidden');
  });
  grp.querySelector('.caret').textContent = collapsed ? '▸' : '▾';
});

if(!UID){
  $('err').innerHTML = '<div class="errbox">缺少参数 uid，'
    + '请从<a href="/">总览页</a>点「明细」进入。</div>';
  $('rows').innerHTML = '<tr><td colspan="11" class="skel">—</td></tr>';
}else{
  $('period').value = period;
  $('period').max = defaultPeriod();
  setPeriod(period);
  $('refresh').addEventListener('click', load);
  $('period').addEventListener('change', () => {
    const v = $('period').value;
    if(!PERIOD_RE.test(v)) return;
    setPeriod(v);
    load();
  });
  load();
}
</script>
</body>
</html>
